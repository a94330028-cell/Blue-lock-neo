name: NEO FOUNDATION - integridade da liga

on:
  pull_request:
    paths:
      - 'app/**'
      - 'web/**'
      - 'tests/**'
      - 'tools/sync_inline_v930.py'
      - '.github/workflows/neo-foundation-ci.yml'
  push:
    branches: [main, 'codex/neo-foundation']
    paths:
      - 'app/**'
      - 'web/**'
      - 'tests/**'
      - 'tools/sync_inline_v930.py'
      - '.github/workflows/neo-foundation-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Conferir JavaScript e reconstruir a pagina offline
        run: |
          node --check web/engine.js
          node --check web/app.js
          node --check web/systems/progression.js
          node --check web/neo-coach-v980.js
          node --check web/neo-mobile-ux-v111.js
          python3 tools/sync_inline_v930.py web
      - name: Validar transacoes, 20 partidas e recuperacao de estatisticas
        run: node tests/neo-foundation.test.cjs
      - name: Estressar 20 rodadas, 60 partidas e sequenciamento de tres campos
        run: node tests/neo-foundation-scale.test.cjs
      - name: Medir gols, assistencias, efeito de OVR e penaltis reais
        run: node tests/neo-foundation-balance.test.cjs
      - name: Garantir compatibilidade do tecnico, Masters e ligas antigas
        run: |
          node tests/neo-foundation-match-coach.test.cjs
          node tests/neo-foundation-coach.test.cjs
          node tests/coach-fixes-v10637.test.cjs
          node tests/league-hub-v10634.test.cjs
          node tests/league-v10635.test.cjs
          node tests/league-fixes-v10636.test.cjs
          node tests/neo-master-market-v1.test.cjs
          node tests/v980.test.cjs
          node tests/neo-league-market-v202.test.cjs
      - name: Proteger origem e dados durante a atualização Android
        run: node tests/neo-foundation-android-update.test.cjs
      - name: Preparar Chromium para teste visual real
        run: |
          command -v google-chrome || command -v chromium || command -v chromium-browser
          npm install --prefix /tmp/neo-ui-validate --no-save --no-package-lock --no-audit playwright-core@1.56.1
      - name: Conferir a tela no PC e no celular
        run: |
          node tests/v230-browser.test.cjs
          node tests/neo-foundation-browser.test.cjs
      - name: Resumo da validacao
        run: |
          echo '### NEO FOUNDATION' >> "$GITHUB_STEP_SUMMARY"
          echo 'Sem publicacao: integridade transacional, rankings, Masters e save testados.' >> "$GITHUB_STEP_SUMMARY"

  android-preview:
    name: Compilar APK Android sem publicar
    if: github.event_name == 'pull_request'
    needs: foundation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Sincronizar motor real e interface para WebView
        run: |
          set -euo pipefail
          python3 tools/sync_inline_v930.py web
          mkdir -p app/src/main/assets/site
          rsync -a --exclude='/updates/' --exclude='/.nojekyll' --exclude='/_headers' --exclude='/service-worker.js' web/ app/src/main/assets/site/
      - name: Preparar Android SDK 35
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compilar APK de desenvolvimento
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: NEO-FOUNDATION-DEBUG-NAO-PUBLICAR
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
