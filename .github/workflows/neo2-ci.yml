name: NEO 2.0 — Catálogo e compatibilidade (branch de desenvolvimento)
on:
  push:
    branches: [neo-2.0]
    paths:
      - 'web/**'
      - 'app/**'
      - 'tools/**'
      - 'tests/**'
      - 'CHANGELOG.json'
      - 'docs/NEO-2.0.md'
      - '.github/workflows/neo2-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: Testar habilidades, saves e pacote offline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Garantir que as técnicas e artes SVG estão válidas
        run: |
          node --check web/neo2-abilities-v200.js
          node --check web/app.js
          node --check web/engine.js
          node tests/neo2-abilities-v200.test.cjs
      - name: Regressões importantes de partidas, liga, elenco e mercado
        run: |
          node tests/v1051.test.cjs
          node tests/neo-lineup-cards-v112.test.cjs
          node tests/neo-bids-v3.test.cjs
          node tests/neo-master-market-v1.test.cjs
      - name: Validar notas compactas e limite do Android
        run: |
          python3 -m unittest discover -s tests -p test_neo_v2_release.py -v
          python3 tools/neo_v2_release_guard.py --write-report
      - name: Montar a mesma página usada pelo site e APK
        run: |
          test -s web/index.html || python3 tools/assemble_web.py
          python3 tools/sync_inline_v930.py web
          grep -Fq 'neo2-abilities-v200.js?v=2.0.0' web/index.html
          python3 - <<'PY'
          from pathlib import Path
          page=Path('web/index.html').read_text(encoding='utf-8')
          marker='<script src="neo2-abilities-v200.js?v=2.0.0"></script>'
          assert page.count(marker)==1, 'Module must appear exactly once'
          assert page.index(marker)<page.index('function renderScorerBoard(){'), 'Ability module must load before immediate app.init()'
          assert page.index('const TICK = 1/30')<page.index(marker), 'Match engine must load before ability expansion'
          print('PASS: original engine -> 2.0 techniques -> app startup, one copy only')
          PY
          test -s web/assets/neo2-skills/save.svg
          test -s web/assets/neo2-skills/shot.svg
          echo "O HTML contém a expansão e a versão Android pode empacotar os ativos."
      - name: Checar atualização completa de fallback (APK antigo)
        run: |
          python3 tools/gerar_atualizacao.py
          python3 - <<'PY'
          from pathlib import Path
          import json
          r=json.loads(Path('web/updates/size-report.json').read_text(encoding='utf-8'))
          print('Arquivos web:',r['files']['total_web_files'])
          print('Descompactado:',r['files']['uncompressed_bytes'],'bytes')
          print('Maiores ativos:',r['files']['biggest'][:5])
          PY
  android:
    name: Compilar APK de teste da branch 2.0 (sem publicar)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Empacotar web local da branch 2.0
        run: |
          test -s web/index.html || python3 tools/assemble_web.py
          python3 tools/sync_inline_v930.py web
          mkdir -p app/src/main/assets/site
          rsync -a --exclude='/updates/' --exclude='/.nojekyll' --exclude='/_headers' --exclude='/service-worker.js' web/ app/src/main/assets/site/
      - name: Preparar Android SDK 35
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Construir APK isolado
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: NEO-2.0-DEV-APK-TESTE
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
