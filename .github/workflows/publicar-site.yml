name: Publicar Blue Lock NEO e atualizações
on:
  push:
    branches: [main]
    paths:
      - 'packed/**'
      - 'portrait-pack/**'
      - 'web/**'
      - 'tools/**'
      - 'tests/**'
      - 'CHANGELOG.json'
      - '.github/workflows/publicar-site.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: blue-lock-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    outputs:
      artifact_name: ${{ steps.name.outputs.value }}
      pages_ready: ${{ steps.configure_pages.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruir jogo, histórico e pacote de atualização
        run: |
          test -f web/index.html
          test -f web/neo-ego-v91.js
          test -f web/neo-round-v990.js
          grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' web/VERSION
          python tools/sync_inline_v930.py web
          node tests/v970.test.cjs
          node tests/v980.test.cjs
          node tests/v981.test.cjs
          node tests/v990.test.cjs
          node tests/kaiser-icon-v991.test.cjs
          node tests/gallery-v992.test.cjs
          node tests/gallery-v993.test.cjs
          node tests/portraits-v10633.test.cjs
          node tests/league-hub-v10634.test.cjs
          node tests/native-photo-v994.test.cjs
          node tests/samsung-gallery-v201.test.cjs
          node tests/v1000.test.cjs
          node tests/v1030.test.cjs
          node tests/v1040.test.cjs
          node tests/neo-lineup-cards-v112.test.cjs
          node tests/v1050.test.cjs
          node tests/v1051.test.cjs
          node tests/v1060.test.cjs
          node tests/update-notice-v201.test.cjs
          node tests/history-team-v201.test.cjs
          node tests/neo-league-participants-v201.test.cjs
          node tests/neo-league-market-v202.test.cjs
          node tests/neo-assists-v203.test.cjs
          node tests/v110.test.cjs
          node tests/v120.test.cjs
          node tests/v130.test.cjs
          node tests/v140.test.cjs
          node tests/v150.test.cjs
          node tests/v160.test.cjs
          node tests/v170.test.cjs
          node tests/v180.test.cjs
          node tests/v190.test.cjs
          node tests/v200.test.cjs
          node tests/v230.test.cjs
          node tests/v230-validation.test.cjs
          node tests/v250.test.cjs
          node tests/v255-season.test.cjs
          node tests/neo-team-logos.test.cjs
          node tests/neo-bids-v3.test.cjs
          node tests/neo-master-market-v1.test.cjs
          node --check web/neo-advanced-v200.js
          node --check web/neo-universe-v220.js
          node --check web/neo-twelve-v230.js
          node --check web/neo-match-pulse-v240.js
          node --check web/neo-universe-spotlight-v250.js
          python3 -m unittest discover -s tests -p test_neo_announcer.py
          python3 tools/neo_update_announcement.py validate
          python tools/gerar_atualizacao.py
      - name: Disponibilizar site completo
        uses: actions/upload-artifact@v4
        with:
          name: Site-Blue-Lock-NEO-${{ github.run_id }}-${{ github.run_attempt }}
          path: web/
          retention-days: 14
      - name: Configurar GitHub Pages
        id: configure_pages
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true
      - name: Selecionar nome único do pacote de deploy
        id: name
        run: echo "value=neo-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Enviar pacote único para GitHub Pages
        if: steps.configure_pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v4
        with:
          name: ${{ steps.name.outputs.value }}
          path: web
      - name: Mostrar instruções se Pages ainda não estiver habilitado
        if: steps.configure_pages.outcome != 'success'
        run: |
          echo '### Hospedagem: falta habilitar GitHub Pages' >> "$GITHUB_STEP_SUMMARY"
          echo 'Em Settings > Pages, selecione GitHub Actions como fonte.' >> "$GITHUB_STEP_SUMMARY"
          echo 'O site completo foi anexado em Artifacts.' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build
    if: needs.build.outputs.pages_ready == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Obter validador de anúncios desta versão
        uses: actions/checkout@v4
      - name: Publicar pacote aprovado no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
      - name: Validar artes oficiais somente após deploy confirmado
        id: neo_media
        if: steps.deployment.outcome == 'success'
        continue-on-error: true
        run: python3 tools/neo_update_announcement.py validate --require-media
      - name: Anunciar atualização no Discord somente após deploy real
        id: neo_announce
        if: steps.deployment.outcome == 'success' && steps.neo_media.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NEO_PING_EVERYONE: "0"
        run: python3 tools/neo_update_announcement.py publish
      - name: Registrar motivo do bloqueio de anúncio
        if: steps.deployment.outcome == 'success' && steps.neo_media.outcome != 'success'
        run: |
          echo '### NEO UPDATE BOT: anúncio não enviado' >> "$GITHUB_STEP_SUMMARY"
          echo 'As imagens originais ainda não foram verificadas. O site foi publicado; o webhook permanece bloqueado.' >> "$GITHUB_STEP_SUMMARY"
      - name: Registrar ausência do webhook ou falha no envio
        if: steps.deployment.outcome == 'success' && steps.neo_media.outcome == 'success' && steps.neo_announce.outcome != 'success'
        run: |
          echo '### NEO UPDATE BOT: publicação concluída; Discord ainda não recebeu o anúncio.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Configure DISCORD_WEBHOOK_URL em Settings → Secrets and variables → Actions e use o workflow manual NEO UPDATE BOT → announce.' >> "$GITHUB_STEP_SUMMARY"
