name: Publicar Blue Lock NEO e atualizações
on:
  push:
    branches: [main]
    paths:
      - 'packed/**'
      - 'portrait-pack/**'
      - 'web/**'
      - 'tools/**'
      - '.github/workflows/publicar-site.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: blue-lock-pages
  cancel-in-progress: true
jobs:
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruir jogo e pacote de atualização
        run: |
          test -f web/index.html
          test -f web/neo-ego-v91.js
          test -f web/neo-round-v990.js
          grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' web/VERSION
          python tools/sync_inline_v930.py web
          node tests/v970.test.cjs
          node tests/v980.test.cjs
          node tests/v981.test.cjs
          node tests/v990.test.cjs
          python tools/gerar_atualizacao.py
      - name: Disponibilizar site completo (mesmo antes de habilitar Pages)
        uses: actions/upload-artifact@v4
        with:
          name: Site-Blue-Lock-NEO
          path: web/
          retention-days: 14
      - name: Configurar GitHub Pages
        id: configure_pages
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true
      - name: Enviar arquivos para GitHub Pages
        if: steps.configure_pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Publicar no GitHub Pages
        id: deployment
        if: steps.configure_pages.outcome == 'success'
        uses: actions/deploy-pages@v4
      - name: Mostrar instrução se Pages ainda não estiver habilitado
        if: steps.configure_pages.outcome != 'success'
        run: |
          echo '### Hospedagem: falta habilitar GitHub Pages' >> "$GITHUB_STEP_SUMMARY"
          echo 'Em Settings > Pages, selecione **GitHub Actions** como fonte.' >> "$GITHUB_STEP_SUMMARY"
          echo 'O site completo já está anexado na execução em Artifacts > Site-Blue-Lock-NEO.' >> "$GITHUB_STEP_SUMMARY"
