name: Importar artes NEO oficiais (execução única)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/neo-media-import-once.yml']
permissions:
  contents: write
jobs:
  media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Baixar as duas imagens originais fornecidas para o projeto
        run: |
          python3 - <<'PY'
          import urllib.request,re,hashlib,pathlib,struct
          data=[("avatar","https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F65c16a0e-adba-4a0d-88c2-240eb4fefe89/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAIiCDfcSWd6VxAa7uYh134WFqtlRtmhq0VG7f9TFX2Ll&exp=1794948309&osig=AAAAAAAAAAAAAAAAAAAAAMa7qM4Z2-xqwi97nx_9e8IwTYzV3I8Dm4XXhTZczUHO&signer=media-rpc&token=AAIAAU0AJDY1YzE2YTBlLWFkYmEtNGEwZC04OGMyLTI0MGViNGZlZmU4OQAAAAABoetBoAh33Z-eTDnQtDcPMERvt4iXh5WUr-n9xXpbhdUafuuqNQ&x-canva-quality=thumbnail",1254,1254),("banner","https://media.canva.com/v2/image-resize/format:PNG/height:100/quality:100/uri:ifs%3A%2F%2FM%2Fbf4390ac-5588-4286-8e53-e4aa5a007ef0/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAClkM4o4Gx1QyrMQ08Ov8bc1hbG-txcEFMyi97YMsaGz&exp=1794948467&osig=AAAAAAAAAAAAAAAAAAAAAB-OJLZnmedipnF6D7ApmvVKqh9CZJOsk6IwkRqzB1jS&signer=media-rpc&token=AAIAAU0AJGJmNDM5MGFjLTU1ODgtNDI4Ni04ZTUzLWU0YWE1YTAwN2VmMAAAAAABoetECThrU4ebCNmhIdPdpJwdtbihK11OfhOkPDZJy0SRdQLelg&x-canva-quality=thumbnail",1774,887)]
          for key,url,w,h in data:
              larger=re.sub(r'/height:[0-9]+','/height:'+str(h),url)
              larger=re.sub(r'/width:[0-9]+','/width:'+str(w),larger)
              raw=None
              for candidate in (larger,url):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(candidate,headers={"User-Agent":"Mozilla/5.0"}),timeout=35) as response:
                          content=response.read()
                      if not content.startswith(bytes.fromhex('89504e470d0a1a0a')) or len(content)<2048:
                          raise RuntimeError("not PNG")
                      raw=content
                      if candidate==larger:print('Original-size download verified',key)
                      else:print('Thumbnail fallback used',key)
                      break
                  except Exception as err:
                      print('Attempt not available',key,type(err).__name__)
              if raw is None:raise RuntimeError('Cannot retrieve official graphic '+key)
              path=pathlib.Path('web/assets/updates/neo-update-'+key+'.png')
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(raw)
              width,height=struct.unpack('>II',raw[16:24])
              print('MEDIA_SHA256 '+key+' '+hashlib.sha256(raw).hexdigest()+' '+str(width)+'x'+str(height)+' '+str(len(raw)))
          
          PY
      - name: Registrar as imagens no próprio repositório (não envia mensagem)
        run: |
          git config user.name "neo-update-assets[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/assets/updates/neo-update-avatar.png web/assets/updates/neo-update-banner.png
          if ! git diff --cached --quiet; then
            git commit -m "assets(neo-2.0): adopt new supplied official yellow avatar and blue update banner"
            git push origin HEAD:main
          fi
