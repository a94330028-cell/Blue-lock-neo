name: Publicar APK Kaiser assinado para atualizar sem desinstalar
on:
  push:
    branches: [main]
    paths:
      - 'release-staging/v9.9.1/**'
      - '.github/workflows/publicar-apk-kaiser-assinado.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remontar e validar APK assinado
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(release-staging/v9.9.1/part-*.bin)
          test "${#parts[@]}" -eq 62
          mkdir -p signed-release
          cat "${parts[@]}" > signed-release/Blue-Lock-NEO-v9.9.1-KAISER-ASSINADO.apk
          echo "cf9bf4dadd53850847ca320cdd5985aaece4be21693d7a6198a2c6e0ea3f2884  signed-release/Blue-Lock-NEO-v9.9.1-KAISER-ASSINADO.apk" | sha256sum --check -
          python3 - <<'PY'
          import zipfile
          p="signed-release/Blue-Lock-NEO-v9.9.1-KAISER-ASSINADO.apk"
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              assert z.read('assets/site/VERSION').decode().strip()=='9.9.1'
              assert sum(n.startswith('assets/site/assets/imported-portraits/') and n.endswith('.jpg') for n in z.namelist()) == 87
          print('APK assinado intacto, versão 9.9.1, 87 retratos.')
          PY
      - name: Publicar APK assinado no GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v9.9.1
          name: Blue Lock NEO v9.9.1 — Kaiser (atualização assinada)
          prerelease: false
          make_latest: true
          overwrite_files: true
          body: |
            APK assinado para atualizar o Blue Lock NEO existente sem desinstalar, caso a instalação atual utilize o certificado de assinatura estável das versões v9.0–v9.8.
            Arquivo recomendado: Blue-Lock-NEO-v9.9.1-KAISER-ASSINADO.apk
            Pacote Android: com.neoegoist.simulator
            Versão Android: 9.9.1 / versionCode 102
            SHA-256: cf9bf4dadd53850847ca320cdd5985aaece4be21693d7a6198a2c6e0ea3f2884
            Certificado de assinatura SHA-256: 206cb88c0f84b059e4f15c4bdb9880927a70e73a0419ea00d58ec4ec4fcf55c5
            Faça backup antes por segurança. Não desinstale seu aplicativo nem limpe os dados.
          files: signed-release/Blue-Lock-NEO-v9.9.1-KAISER-ASSINADO.apk
          fail_on_unmatched_files: true
      - name: Remover APK de teste incompatível do release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release delete-asset v9.9.1 Blue-Lock-NEO-v9.9.1-Android-TESTE.apk --yes || true
