name: Gerar APK Blue Lock NEO (atualizável)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'packed/**'
      - 'portrait-pack/**'
      - 'web/**'
      - 'tests/**'
      - 'CHANGELOG.json'
      - 'tools/assemble_web.py'
      - 'tools/sync_inline_v930.py'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/gerar-apk.yml'
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sincronizar versão web offline no APK
        shell: bash
        run: |
          set -euo pipefail
          test -f web/index.html
          python3 tools/sync_inline_v930.py web
          mkdir -p app/src/main/assets/site
          rsync -a --exclude='/updates/' --exclude='/.nojekyll' --exclude='/_headers' --exclude='/service-worker.js' web/ app/src/main/assets/site/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK 35 no runner
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Testar navegação, atualização e simulação v9.2
        run: |
          node tests/navigation-v912.test.js
          node tests/broadcast-v920.test.js
          node tests/v970.test.cjs
          node tests/v980.test.cjs
          node tests/v981.test.cjs
          node tests/v990.test.cjs
          node tests/kaiser-icon-v991.test.cjs
          node tests/gallery-v992.test.cjs
          node tests/gallery-v993.test.cjs
          node tests/native-photo-v994.test.cjs
          node tests/v1000.test.cjs
          node tests/v1030.test.cjs
          node tests/v1040.test.cjs
          node tests/v1050.test.cjs
          node tests/v1051.test.cjs
          node tests/v1060.test.cjs
          node tests/v110.test.cjs
          node tests/v120.test.cjs
          node tests/v130.test.cjs
          python3 -m unittest discover -s tests -p test_neo_announcer.py
          python3 tools/neo_update_announcement.py validate
          node --check web/neo-clubs-v1050.js
          node --check web/neo-photo-recovery-v1050.js
          node --check web/neo-football-v1010.js
          node --check web/neo-insights-v1020.js
          node --check web/neo-tournament-v1030.js
          node --check web/neo-coach-v980.js
          node --check web/neo-squads-v980.js
          node --check web/neo-match-v981.js
          node --check web/neo-round-v990.js
          node --check web/neo-updates-v1060.js
          node --check web/neo-ai-v110.js
          node --check web/neo-evolution-v120.js
          node --check web/neo-living-v130.js
          node --check web/neo-player-data-v960.js
          node --check web/systems/progression.js
          node --check web/neo-v960.js
          node --check web/neo-v930.js
          node --check web/neo-broadcast-v920.js
          node --check web/mobile-upgrade.js
          node --check web/engine.js
          node --check web/neo-v960.js
          node --check web/app.js
          node --check web/neo-historic-teams-v970.js
          node --check web/neo-cups-v970.js
          node --check web/neo-studio-v970.js
          node --check web/systems/progression.js
      - name: Preparar ferramenta de assinatura para o mantenedor
        shell: bash
        run: |
          set -euo pipefail
          find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner.jar -type f -print -quit | xargs -r -I{} cp "{}" "${RUNNER_TEMP}/neo-apksigner.jar"
          test -s "${RUNNER_TEMP}/neo-apksigner.jar"
      - uses: actions/upload-artifact@v4
        with:
          name: Android-APKSIGNER-public-tool
          path: ${{ runner.temp }}/neo-apksigner.jar
          retention-days: 2
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compilar APK de teste
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Blue-Lock-NEO-APK-TESTE
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Preparar download direto do APK
        id: release_info
        run: |
          VERSION="$(cat web/VERSION)"
          test -n "$VERSION"
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk "release/Blue-Lock-NEO-v${VERSION}-Android-TESTE.apk"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Publicar APK diretamente no GitHub Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release_info.outputs.version }}
          name: Blue Lock NEO v${{ steps.release_info.outputs.version }} — Mobile Edition
          prerelease: true
          make_latest: false
          body: |
            APK instalável do simulador Blue Lock NEO.

            Abra o arquivo .apk diretamente no Android para instalar.
            Esta é uma compilação de TESTE (assinatura debug).
            Para atualizar uma instalação de teste anterior talvez seja necessário desinstalá-la.
            Exporte os backups do jogo antes de reinstalar.
            O código-fonte e o histórico completo permanecem no repositório.
          files: release/*.apk
          fail_on_unmatched_files: true
      - name: Preparar assinatura estável (opcional, recomendado)
        env:
          KEYSTORE_B64: ${{ secrets.BL_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.BL_SIGNING_STORE_PASSWORD }}
          KEY_NAME: ${{ secrets.BL_SIGNING_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.BL_SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASS" ] || [ -z "$KEY_NAME" ] || [ -z "$KEY_PASS" ]; then
            echo 'APK assinado de atualização indisponível: configure os quatro secrets BL_* no GitHub.'
            echo 'BUILD_SIGNED=0' >> "$GITHUB_ENV"
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/blue-lock-keystore.jks"
          echo "BL_SIGNING_FILE=$RUNNER_TEMP/blue-lock-keystore.jks" >> "$GITHUB_ENV"
          echo 'BUILD_SIGNED=1' >> "$GITHUB_ENV"
      - name: Compilar APK assinado para atualizações futuras
        if: env.BUILD_SIGNED == '1'
        env:
          BL_SIGNING_STORE_PASSWORD: ${{ secrets.BL_SIGNING_STORE_PASSWORD }}
          BL_SIGNING_KEY_ALIAS: ${{ secrets.BL_SIGNING_KEY_ALIAS }}
          BL_SIGNING_KEY_PASSWORD: ${{ secrets.BL_SIGNING_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon
      - name: Compilar release sem assinatura para assinatura local segura
        if: env.BUILD_SIGNED != '1'
        run: gradle :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        if: env.BUILD_SIGNED != '1'
        with:
          name: Blue-Lock-NEO-RELEASE-SEM-ASSINATURA
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: env.BUILD_SIGNED == '1'
        with:
          name: Blue-Lock-NEO-APK-ASSINADO-ATUALIZAVEL
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
